name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
env:
  RUN_NUMBER: ${{ github.run_number }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decode signing key
        run: base64 -d ci/debug-keystore.b64 > ci/debug-keystore.jks
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AmboGame.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AmboGame
          path: AmboGame.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          files: AmboGame.apk
